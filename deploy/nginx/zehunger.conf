# nginx site for the Zehunger ERP. Replace erp.example.com with your domain.
# HTTPS is required: sign-in cookies are sent over HTTPS only, so the app
# cannot be used over plain HTTP. Certificates: certbot (see DEPLOYMENT.md).

upstream zehunger_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # certbot's HTTP challenge, then everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # (nginx 1.25+ prefers a separate "http2 on;"; this form works on 1.18-1.24 too.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zehunger_tls:10m;

    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # Static assets straight from disk (the app serves the same files).
    location ~ ^/(css|js|images)/ {
        root /opt/zehunger/app/frontend;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Uptime monitors poll these; keep them out of the access log.
    location = /healthz { proxy_pass http://zehunger_app; access_log off; include /etc/nginx/zehunger-proxy.conf; }
    location = /readyz  { proxy_pass http://zehunger_app; access_log off; include /etc/nginx/zehunger-proxy.conf; }

    location / {
        proxy_pass http://zehunger_app;
        include /etc/nginx/zehunger-proxy.conf;
    }
}
