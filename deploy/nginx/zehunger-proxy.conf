# Proxy headers for the Zehunger ERP (included by zehunger.conf; install as
# /etc/nginx/zehunger-proxy.conf). The app trusts exactly one proxy
# (TRUSTED_PROXY_COUNT=1): these headers tell it the real client address and
# that the request arrived over HTTPS.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 75s;
proxy_send_timeout 75s;
