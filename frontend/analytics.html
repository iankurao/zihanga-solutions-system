<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard — BSF Farm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/erp.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="/css/reports.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Colours and type from the ERP design tokens (css/erp.css). */
    :root {
      --primary: var(--erp-accent);
      --primary-dark: var(--erp-accent-hover);
      --sidebar: var(--erp-brand);
      --sidebar-active: var(--erp-accent);
      --text: var(--erp-ink);
      --text-light: var(--erp-muted);
      --bg: var(--erp-page);
      --card-bg: var(--erp-surface);
      --border: var(--erp-line);
      --shadow: var(--erp-shadow);
    }

    body { font-family: var(--erp-font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap; }
    body > .erp-appbar { flex: 0 0 100%; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px; min-height: 100vh; background: var(--sidebar);
      display: flex; flex-direction: column; flex-shrink: 0;
      position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow-y: auto;
    }

    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .sidebar-logo img { width: 40px; height: 40px; border-radius: 50%; }
    .sidebar-logo span { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .5px; }

    .sidebar-heading {
      padding: 14px 16px 6px;
      font-size: .7rem; text-transform: uppercase; letter-spacing: 1px;
      color: rgba(255,255,255,.4); font-weight: 600;
    }

    .tab-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px; cursor: pointer; color: rgba(255,255,255,.75);
      font-size: .88rem; transition: all .2s; border: none; background: none; width: 100%; text-align: left;
    }

    .tab-btn i { width: 18px; text-align: center; }
    .tab-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
    .tab-btn.active { background: var(--primary); color: #fff; font-weight: 600; }

    .sidebar-divider { height: 1px; background: rgba(255,255,255,.08); margin: 8px 0; }

    .back-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px; color: rgba(255,255,255,.6); font-size: .85rem;
      text-decoration: none; transition: color .2s; margin-top: auto;
    }
    .back-btn:hover { color: #fff; }

    /* ── Main ── */
    .main { flex: 1; min-width: 0; padding: 24px; }

    .page-header {
      background: var(--sidebar);
      border-radius: 14px; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(44,62,80,.15);
    }

    .page-header-left h1 { color: #fff; font-size: 1.5rem; margin-bottom: 4px; }
    .page-header-left p { color: rgba(255,255,255,.6); font-size: .88rem; }

    .refresh-btn {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
      color: #fff; padding: 9px 18px; border-radius: 8px; cursor: pointer;
      font-size: .88rem; display: flex; align-items: center; gap: 8px; transition: all .2s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,.25); }

    /* ── Overview Cards ── */
    .overview-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }

    .overview-card {
      background: var(--card-bg); border-radius: 12px;
      padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }

    .overview-card-label { font-size: .75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: .5px; }
    .overview-card-value { font-size: 1.6rem; font-weight: 700; color: var(--text); }
    .overview-card-icon { font-size: 1.2rem; }

    /* ── Tab Sections ── */
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.15rem; font-weight: 700; color: var(--text);
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
    }

    .section-title i { color: var(--primary); }

    /* ── Subsection Panel ── */
    .subsection-panel {
      background: var(--card-bg); border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 20px;
      box-shadow: var(--shadow); overflow: hidden;
    }

    .bsf-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--sidebar);
      color: #fff; padding: 14px 20px; flex-wrap: wrap; gap: 8px;
    }

    .bsf-panel-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .bsf-badge {
      background: rgba(255,255,255,.18); border-radius: 20px;
      padding: 3px 12px; font-size: .82rem; font-weight: 500;
    }

    .bsf-summary-cards {
      display: flex; flex-wrap: wrap; gap: 12px;
      padding: 16px 20px; background: #f8f9fb; border-bottom: 1px solid var(--border);
    }

    .bsf-card {
      background: #fff; border-radius: 10px; padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      min-width: 150px; flex: 1;
      box-shadow: 0 1px 6px rgba(44,62,80,.07);
      transition: transform .2s, box-shadow .2s;
    }
    .bsf-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(44,62,80,.12); }
    .bsf-card-icon { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
    .bsf-card-value { font-size: 1.35rem; font-weight: 700; color: var(--erp-ink); line-height: 1.2; }
    .bsf-card-label { font-size: .73rem; color: var(--erp-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    .bsf-charts-grid {
      display: flex; flex-wrap: wrap; gap: 16px;
      padding: 16px 20px; background: #fff; border-bottom: 1px solid var(--border);
    }

    .bsf-chart-container {
      background: #fafbfc; border-radius: 10px; padding: 14px;
      flex: 1; min-width: 260px; max-width: 420px; border: 1px solid var(--border);
    }

    .bsf-chart-title { font-size: .85rem; font-weight: 600; color: var(--erp-ink); margin-bottom: 10px; text-align: center; }

    .bsf-table-section { padding: 16px 20px; }

    .bsf-table-title {
      font-size: .92rem; font-weight: 600; color: var(--erp-ink);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }

    .bsf-table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }

    .bsf-table { width: 100%; border-collapse: collapse; font-size: .83rem; }

    .bsf-table thead tr { background: linear-gradient(90deg, var(--erp-accent), var(--erp-accent-hover)); color: #fff; }

    .bsf-table thead th {
      padding: 10px 12px; text-align: left; font-weight: 600;
      white-space: nowrap; font-size: .8rem; text-transform: uppercase; letter-spacing: .4px;
    }

    .bsf-table tbody tr:nth-child(even) { background: #f8f9fb; }
    .bsf-table tbody tr:hover { background: #eaf6ee; }

    .bsf-table td {
      padding: 9px 12px; border-bottom: 1px solid #eef0f5;
      color: var(--erp-ink); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .bsf-empty { text-align: center; color: #95a5a6; padding: 24px; font-style: italic; }

    .bsf-btn-delete {
      background: #fee; border: 1px solid #fcc; color: var(--erp-danger);
      border-radius: 6px; padding: 4px 8px; cursor: pointer;
      font-size: .78rem; transition: all .2s;
    }
    .bsf-btn-delete:hover { background: var(--erp-danger); color: #fff; border-color: var(--erp-danger); }

    .bsf-export-buttons {
      display: flex; gap: 10px; padding: 14px 20px;
      background: #f8f9fb; border-top: 1px solid var(--border); flex-wrap: wrap;
    }

    .bsf-btn-excel, .bsf-btn-pdf {
      padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
      font-size: .86rem; font-weight: 600; display: flex; align-items: center; gap: 7px; transition: all .2s;
    }

    .bsf-btn-excel { background: linear-gradient(135deg, var(--primary-dark), var(--erp-accent-hover)); color: #fff; }
    .bsf-btn-excel:hover { box-shadow: 0 4px 12px rgba(39,174,96,.35); transform: translateY(-1px); }

    .bsf-btn-pdf { background: linear-gradient(135deg, #922b21, var(--erp-danger)); color: #fff; }
    .bsf-btn-pdf:hover { box-shadow: 0 4px 12px rgba(231,76,60,.35); transform: translateY(-1px); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .tab-section.active { animation: fadeIn .3s ease; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      /* A wrapping column sizes to its widest content; keep wide report tables scrolling in their own box. */
      body > .main, body > .erp-appbar { max-width: 100%; }
      .sidebar { width: 100%; min-height: unset; flex-direction: row; flex-wrap: wrap; position: static; }
      .tab-btn { font-size: .8rem; padding: 8px 12px; }
      .bsf-summary-cards { flex-direction: column; }
      .bsf-chart-container { max-width: 100%; }
    }
  </style>
  <style>[data-permission][hidden] { display: none !important; }</style>
</head>
<body>
  <header data-erp-nav></header>

  <!-- ── Sidebar ── -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <a href="/dashboard" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <img src="images/logo.png" alt="BSF Farm">
        <span>BSF FARM</span>
      </a>
    </div>

    <div class="sidebar-heading">Reports</div>

    <button class="tab-btn active" onclick="switchTab('reports', this)">
      <i class="fas fa-file-lines"></i> Operational reports
    </button>

    <div class="sidebar-divider"></div>

    <a class="back-btn" href="/dashboard">
      <i class="fas fa-arrow-left"></i> Back to Main App
    </a>
  </nav>

  <!-- ── Main Content ── -->
  <main class="main">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-left">
        <h1><i class="fas fa-chart-line"></i> Analytics Dashboard</h1>
        <p>Figures from the production chain, limited to the farms and facilities you can access</p>
      </div>
    </div>

    <!-- ── OPERATIONAL REPORTS ── -->
    <div id="tab-reports" class="tab-section active">
      <div class="section-title"><i class="fas fa-file-lines"></i> Operational reports</div>
      <div class="report-builder">
        <div class="report-field report-field-wide">
          <label for="reportKey">Report</label>
          <select id="reportKey"></select>
        </div>
        <div class="report-field" data-filter="dates">
          <label for="reportFrom">From</label>
          <input type="date" id="reportFrom">
        </div>
        <div class="report-field" data-filter="dates">
          <label for="reportTo">To</label>
          <input type="date" id="reportTo">
        </div>
        <div class="report-field" data-filter="farm">
          <label for="reportFarm">Farm</label>
          <select id="reportFarm"><option value="">All my farms</option></select>
        </div>
        <div class="report-field" data-filter="facility">
          <label for="reportFacility">Facility</label>
          <select id="reportFacility"><option value="">All facilities</option></select>
        </div>
        <div class="report-field" data-filter="status">
          <label for="reportStatus">Status</label>
          <select id="reportStatus"><option value="">Any status</option></select>
        </div>
        <div class="report-field" data-filter="product">
          <label for="reportProduct">Product</label>
          <input id="reportProduct" list="reportProducts" maxlength="50" placeholder="Any product">
          <datalist id="reportProducts"></datalist>
        </div>
        <button type="button" id="reportRun" class="report-run"><i class="fas fa-play"></i> Run report</button>
      </div>
      <p id="reportMessage" class="report-message" role="status" aria-live="polite"></p>
      <div id="reportResult" hidden>
        <div class="report-head">
          <div>
            <h2 id="reportTitle"></h2>
            <p id="reportMeta"></p>
          </div>
          <div class="report-exports">
            <button type="button" id="reportCsv"><i class="fas fa-file-csv"></i> CSV</button>
            <button type="button" id="reportExcel"><i class="fas fa-file-excel"></i> Excel</button>
            <button type="button" id="reportPdf"><i class="fas fa-file-pdf"></i> PDF</button>
          </div>
        </div>
        <div id="reportTotals" class="report-totals"></div>
        <div class="report-table-wrap">
          <table class="report-table" id="reportTable"><thead></thead><tbody></tbody><tfoot></tfoot></table>
        </div>
      </div>
    </div>

  </main>

  <script src="js/exportManager.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/appNav.js"></script>
  <script src="js/reports.js"></script>

  <script>
    function switchTab(id, btn) {
      document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      btn.classList.add('active');
    }
  </script>

  <script src="/js/notificationCenter.js" defer></script>
</body>
</html>
