<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log | Zehunger BSF Farm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/erp.css">
  <link rel="stylesheet" href="/css/audit.css">
</head>
<body class="erp-page">
  <header data-erp-nav></header>

  <main class="erp-main">
    <header class="erp-pagehead">
      <div>
        <p class="erp-eyebrow">Security</p>
        <h1>Audit log</h1>
        <p class="erp-subtitle">Every change to key records and every sign-in or refused request is kept here.
          Entries cannot be edited or deleted. Passwords are never recorded.</p>
      </div>
    </header>

    <section>
      <form id="auditForm" class="erp-filters">
        <div class="erp-field">
          <label for="auditType">Record type</label>
          <select id="auditType"><option value="">All</option></select>
        </div>
        <div class="erp-field">
          <label for="auditRecord">Record ID</label>
          <input id="auditRecord" type="text" maxlength="100" placeholder="e.g. BSF-2026-00002" autocomplete="off">
        </div>
        <div class="erp-field">
          <label for="auditActor">User</label>
          <input id="auditActor" type="text" maxlength="100" placeholder="username" autocomplete="off">
        </div>
        <div class="erp-field">
          <label for="auditAction">Action starts with</label>
          <input id="auditAction" type="text" maxlength="80" list="auditActionHints" placeholder="e.g. auth." autocomplete="off">
          <datalist id="auditActionHints">
            <option value="auth."></option>
            <option value="security."></option>
            <option value="users."></option>
            <option value="production_batches."></option>
            <option value="inventory_movements."></option>
            <option value="quality_approvals."></option>
            <option value="customer_orders."></option>
            <option value="customer_deliveries."></option>
          </datalist>
        </div>
        <div class="erp-field">
          <label for="auditFrom">From</label>
          <input id="auditFrom" type="date">
        </div>
        <div class="erp-field">
          <label for="auditTo">To</label>
          <input id="auditTo" type="date">
        </div>
        <button class="erp-btn" type="submit"><i class="fas fa-magnifying-glass" aria-hidden="true"></i> Search</button>
      </form>
      <div id="auditMessage" class="erp-inline-message" aria-live="polite"></div>
    </section>

    <section class="erp-card">
      <div class="erp-table-wrap">
        <table class="erp-table audit-table">
          <thead>
            <tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Change</th></tr>
          </thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
      <div class="erp-pager">
        <span id="auditShown"></span>
        <button type="button" id="auditMore" class="erp-btn erp-btn--secondary erp-btn--sm" hidden>Load older entries</button>
      </div>
    </section>
  </main>

  <script src="/js/permissions.js"></script>
  <script src="/js/appNav.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/audit.js"></script>
  <script src="/js/notificationCenter.js" defer></script>
</body>
</html>
