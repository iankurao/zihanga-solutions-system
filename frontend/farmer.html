<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#143c2d">
  <title>My Farm | Zehunger BSF Farm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/erp.css">
  <link rel="stylesheet" href="/css/farmer.css">
</head>
<body class="erp-page farmer-page">
  <header data-erp-nav></header>

  <main class="farmer-main">
    <header class="erp-pagehead farmer-head">
      <div>
        <p class="erp-eyebrow">My farm</p>
        <h1 id="farmerGreeting">My farm</h1>
        <p id="farmerPlaces" class="erp-subtitle"></p>
      </div>
    </header>
    <div id="farmerToast" class="erp-inline-message" aria-live="polite"></div>

    <section aria-labelledby="todayTitle">
      <h2 id="todayTitle"><i class="fas fa-list-check" aria-hidden="true"></i> Today</h2>
      <ul id="farmerTasks" class="farmer-tasks"></ul>
    </section>

    <section aria-labelledby="batchesTitle">
      <h2 id="batchesTitle"><i class="fas fa-seedling" aria-hidden="true"></i> My batches</h2>
      <div id="farmerBatches" class="farmer-batches"></div>
    </section>

    <section aria-labelledby="unitsTitle">
      <h2 id="unitsTitle"><i class="fas fa-cubes" aria-hidden="true"></i> My bio-pods &amp; trays</h2>
      <div id="farmerUnits" class="farmer-units"></div>
    </section>

    <section aria-labelledby="logsTitle" data-permission="production.write" hidden>
      <h2 id="logsTitle"><i class="fas fa-clipboard-list" aria-hidden="true"></i> Other farm records</h2>
      <div class="farmer-logs">
        <a class="erp-btn erp-btn--secondary" href="/dashboard#hatchery"><i class="fas fa-egg" aria-hidden="true"></i> Hatchery</a>
        <a class="erp-btn erp-btn--secondary" href="/dashboard#facility"><i class="fas fa-bug" aria-hidden="true"></i> Fly facility</a>
        <a class="erp-btn erp-btn--secondary" href="/dashboard#waste"><i class="fas fa-recycle" aria-hidden="true"></i> Waste handling</a>
      </div>
    </section>

    <p class="farmer-foot">
      <a href="/dashboard">Open the full workspace</a> ·
      <a href="/operations">Operations dashboard</a>
    </p>
  </main>

  <dialog id="farmerDialog" class="erp-modal farmer-dialog" aria-labelledby="dialogTitle">
    <form id="farmerForm" method="dialog" novalidate>
      <h3 id="dialogTitle">Record</h3>
      <p id="dialogBatch" class="farmer-dialog-batch"></p>
      <div id="dialogFields"></div>
      <p id="dialogError" class="erp-field-error farmer-error" role="alert"></p>
      <div class="farmer-dialog-actions">
        <button type="button" id="dialogCancel" class="erp-btn erp-btn--secondary">Cancel</button>
        <button type="submit" id="dialogSave" class="erp-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/permissions.js"></script>
  <script src="/js/appNav.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/farmer.js"></script>
  <script src="/js/notificationCenter.js" defer></script>
</body>
</html>
