<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders | Zehunger BSF Farm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/erp.css">
  <link rel="stylesheet" href="/css/traceability.css">
  <link rel="stylesheet" href="/css/orders.css">
</head>
<body class="erp-page">
  <header data-erp-nav></header>

  <main class="erp-main">
    <header class="erp-pagehead">
      <div>
        <p class="erp-eyebrow">Sales &amp; delivery</p>
        <h1>Customer orders</h1>
      </div>
      <div class="erp-pagehead-actions">
        <button type="button" id="newOrderButton" class="erp-btn"><i class="fas fa-plus" aria-hidden="true"></i> New order</button>
      </div>
    </header>

    <div class="orders-layout">
    <aside class="erp-card orders-list-panel">
      <div class="erp-field orders-list-head">
        <label for="orderStatusFilter">Show</label>
        <select id="orderStatusFilter">
          <option value="">All orders</option>
          <option value="OPEN" selected>Open</option>
          <option value="FULFILLED">Fulfilled</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
      <div id="orderList" class="orders-list" aria-live="polite"></div>
    </aside>

    <section class="orders-detail">
      <div id="ordersMessage" class="erp-inline-message" aria-live="polite"></div>

      <section id="ordersWelcome" class="erp-state">
        <i class="fas fa-truck" aria-hidden="true"></i>
        <strong>Select or create an order</strong>
        <p>Orders reserve specific product lots, dispatches post stock movements, and every delivery can be traced back to its waste lots.</p>
      </section>

      <form id="newOrderForm" class="erp-card" hidden>
        <h3 class="erp-card-title"><span class="erp-chip"><i class="fas fa-file-invoice" aria-hidden="true"></i></span> New customer order</h3>
        <div class="erp-form">
          <div class="erp-field">
            <label for="orderCustomer">Customer</label>
            <select id="orderCustomer" required></select>
          </div>
          <div class="erp-field">
            <label for="orderFarm">Supplying farm</label>
            <select id="orderFarm" required></select>
          </div>
          <div class="erp-field">
            <label for="orderRequested">Requested delivery</label>
            <input id="orderRequested" type="date">
          </div>
          <div class="erp-field">
            <label for="orderReference">Customer reference</label>
            <input id="orderReference" type="text" maxlength="60" placeholder="PO number (optional)">
          </div>
        </div>
        <p class="erp-subhead">Order lines</p>
        <div id="orderLines" class="order-lines"></div>
        <datalist id="productTypes"></datalist>
        <div class="erp-actions">
          <button type="button" id="addOrderLine" class="erp-btn erp-btn--secondary"><i class="fas fa-plus" aria-hidden="true"></i> Add line</button>
          <button type="submit" class="erp-btn"><i class="fas fa-check" aria-hidden="true"></i> Create order</button>
        </div>
      </form>

      <div id="orderDetail" hidden></div>
    </section>
    </div>
  </main>

  <script src="/js/permissions.js"></script>
  <script src="/js/appNav.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/notificationCenter.js" defer></script>
</body>
</html>
